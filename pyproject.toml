[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compuoti"
version = "0.1.0"
description = "Multi-objective project selection and employee scheduling optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gurobipy>=11.0",
  "pandas>=2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
